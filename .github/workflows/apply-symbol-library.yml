name: Apply verified engineering symbol library
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-symbol-library.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-symbol-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source patch and guard concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '35ae2d4f9c57f5adaf655141a031929b1957add9'
          shas = '''80f5ac0180eee5c92cde8044bb10992ae69296fa
          4b82121dc3fe6015cbfdd0037df59f750132373b
          df13e4272cdfe81d0de62cac56595122098718cb
          3e826513e74d5fd08f1d73e7cb82cc672a994c4e
          8e533c0e6a821ecbe7e880a3860361ffc8a4f27f
          2007822b06fbbe59baf8317a07a046203f6c0fdf
          14f3866e4fd09aaa6cf967df9e4259cffd596b4e
          5c2a6181c07c4d84256b40afecd8b66ead90d2eb'''.split()
          parts = []
          for index, sha in enumerate(shas):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              data = base64.b64decode(record['content'])
              assert len(data) == (6000 if index < 7 else 3472)
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert len(compressed) == 45472
          assert hashlib.sha256(compressed).hexdigest() == '6448b0148a465823e602181c3d25a9fb54a2337c6b5c78f647a1668105393a5e'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=183153)
          assert decoder.eof and not decoder.unused_data and len(patch) == 183152
          assert hashlib.sha256(patch).hexdigest() == '3343cea8403c699663c5df596672db106910e5ee129b1cc5273a95368c61802a'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'symbol-library.patch'
          target.write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert len(paths) == 57 and len(set(paths)) == 57
          for name in paths:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert not any(p in ('.git', '.github', 'node_modules') for p in path.parts)
              assert path.parts[0] in ('README.md', 'RELEASE_NOTES.md', 'package.json', 'packages', 'scripts', 'tests', 'docs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
          print('Applied 57 checksum-verified source, documentation, declaration and test files.')
          PY
      - name: Test and reproduce all deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          npm run build
          rm -f artifacts/npm/*-0.2.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent DXF validator
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Validate editing, mobile library, master geometry and native DXFs
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/render_symbol_atlas.py
      - name: Commit complete validated workspace to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist artifacts/npm
          git diff --cached --stat
          git commit -m 'feat: 223 convention-reviewed CAD symbols, 11 categories and 20 industry drawing starters'
          git push origin HEAD:main
          echo "Release source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save validation evidence and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-021-symbol-library-validation
          path: artifacts
          if-no-files-found: warn
