name: Apply verified native drawing tools release
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-drawing-tools.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-drawing-tools-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete source patch and preserve concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = 'fd39d3c3740b57e50383e33b4ad12a05bd94d10b'
          shas = '''2de0623c4afa1d82ec515d321752dcefbb8559b1
          a75f272ba172514bc093509258064c977f11b377
          23dc2ef6bc27515668d32b13d87baf7e2064501b
          7b0e8f56cc8ad922d17d3eae59c3efad14236d93
          fa68b6c77f7c152e9b19adf48c5937279b08925f
          cbd701da9cbe78882fd90f80bac011b95387afef
          0edeb0a5f993ab29a26c2bb773073b6ca98badfa'''.split()
          parts = []
          for index, sha in enumerate(shas):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              data = base64.b64decode(record['content'])
              assert len(data) == (6000 if index < 6 else 2204)
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert len(compressed) == 38204
          assert hashlib.sha256(compressed).hexdigest() == 'd211aa370ab86eff9ca7283c7a2915ef9fdf64e4ba96b6b3e4374008357fb6a0'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=147145)
          assert decoder.eof and not decoder.unused_data and len(patch) == 147144
          assert hashlib.sha256(patch).hexdigest() == 'd408c1e0febf5982ba7c9ddd36cbff334856fbe8baa7ff553c8e4056a47990de'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drawing-tools.patch'
          target.write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert len(paths) == 44 and len(set(paths)) == 44
          for name in paths:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert not any(p in ('.git', '.github', 'node_modules') for p in path.parts)
              assert path.parts[0] in ('README.md', 'RELEASE_NOTES.md', 'package.json', 'packages', 'scripts', 'tests', 'docs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
          print('Applied all 44 checksum-verified source, declaration, documentation and test files.')
          PY
      - name: Test and reproduce all deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          npm run build
          node scripts/drawing-tool-samples.mjs
          rm -f artifacts/npm/*-0.5.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent DXF validator
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Validate native tools, touch, curves and actual DXF downloads
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_interop.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_cad_editing.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_parametric.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_drawing_tools.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/audit_cad_editing.py
          python tests/audit_parametric.py
          python tests/audit_drawing_tools.py
          python tests/render_symbol_atlas.py
      - name: Commit complete validated workspace to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist artifacts/npm
          git diff --cached --stat
          git commit -m 'feat: 28 native CAD drawing workflows, curve editing, touch previews and drawing package'
          git push origin HEAD:main
          echo "Release source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save validation evidence and all package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-060-drawing-tools-validation
          path: artifacts
          if-no-files-found: warn
