name: Apply verified CAD editing release
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-cad-editing.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-cad-editing-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source patch and preserve concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '7aea0ec035063386185849311821045912fa0fb3'
          shas = '''540ecbea264997728ce0e23e10625e85f00be9ff
          bf83c30310814dddb39a4e6cfbc536a0f886f14c
          47498efde888b8064cf035be12f5375fe36e305c
          df309e6b8b34b460bcfd3bd9c16923899b192d46
          ba390fa5f2b8bdcee9f88b18ab442bbee4033d94
          8e591613b750865c439df4374315e759156820d8
          127949cd16cecf96bde714a65f2239f7a6dc1d58'''.split()
          parts = []
          for index, sha in enumerate(shas):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              data = base64.b64decode(record['content'])
              assert len(data) == (6000 if index < 6 else 3276)
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert len(compressed) == 39276
          assert hashlib.sha256(compressed).hexdigest() == 'f0826b14d734b24803b56b31deab8dfb58e3d706bdadc68f5b2882a22db48972'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=147073)
          assert decoder.eof and not decoder.unused_data and len(patch) == 147072
          assert hashlib.sha256(patch).hexdigest() == '5d16205c02851fc3627ce774e2b75679f56af0de94564ce7d9d312e81c48aeef'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cad-editing.patch'
          target.write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert len(paths) == 42 and len(set(paths)) == 42
          for name in paths:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert not any(p in ('.git', '.github', 'node_modules') for p in path.parts)
              assert path.parts[0] in ('README.md', 'RELEASE_NOTES.md', 'package.json', 'packages', 'tests', 'docs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          print('Applied 42 checksum-verified source, declaration, test and documentation files.')
          PY
      - name: Test and reproduce all deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          npm run build
          rm -f artifacts/npm/*-0.3.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent DXF validator
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Validate editing, dynamic actions, gradient pixels and native DXF downloads
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_interop.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_cad_editing.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/audit_cad_editing.py
          python tests/render_symbol_atlas.py
      - name: Commit complete validated workspace to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist artifacts/npm
          git diff --cached --stat
          git commit -m 'feat: regenerate editable dimensions, evaluate parameterized blocks and render linear gradients'
          git push origin HEAD:main
          echo "Release source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save validation evidence and package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-040-editing-validation
          path: artifacts
          if-no-files-found: warn
