name: Apply verified parametric authoring release
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-parametric-authoring.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-parametric-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete source patch and preserve concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = 'f2eea6c02fc9e9a4e58bfc471e1751fa09076acf'
          shas = '''46647ead31d60665982ae14de12be14199ab5202
          0d72b43a2d2ad85e1378c271e6f7c3bef9aca8f2
          125da0e7f1d43c5376cb6b7593be8c1323dc44fb
          df45b7f5728b9709cbd32068826a434516363b3f
          cfcea41a676b5ae6704e1d94e11937e574379477
          43ffb0bd764049c13273d13369337e2d09b1bb93
          6703f53deb3715ae2c33cbd8778f61ab292c0671
          7c20282870f4dac9c913aa6a96ed8254d7fa2fc9
          81ee40bc4efa322fb5044ecd92bc151458f0c67d
          1655641055e59ce92eb3f4dce4b30259da274046'''.split()
          parts = []
          for index, sha in enumerate(shas):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              data = base64.b64decode(record['content'])
              assert len(data) == (6000 if index < 9 else 260), f'Invalid part length: {index+1}'
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert len(compressed) == 54260
          assert hashlib.sha256(compressed).hexdigest() == 'cddb1098a14a94ae8bd768d76bbffaa1068100ad7e8a07839d88574691caceaa'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=231284)
          assert decoder.eof and not decoder.unused_data and len(patch) == 231283
          assert hashlib.sha256(patch).hexdigest() == '33d821d0f3a5aa7a2fb463c1883018de2f284eaa33a4fda6fafa1fe7a7c0b6c6'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parametric-authoring.patch'
          target.write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert len(paths) == 51 and len(set(paths)) == 51
          for name in paths:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert not any(p in ('.git', '.github', 'node_modules') for p in path.parts)
              assert path.parts[0] in ('README.md', 'RELEASE_NOTES.md', 'package.json', 'packages', 'scripts', 'tests', 'docs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
          print('Applied all 51 verified source, declaration, documentation and test files.')
          PY
      - name: Test and reproduce all deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          npm run build
          rm -f artifacts/npm/*-0.4.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent DXF validator
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Validate shared editing, parametric solving, native attributes and downloads
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_interop.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_cad_editing.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_parametric.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/audit_cad_editing.py
          python tests/audit_parametric.py
          python tests/render_symbol_atlas.py
      - name: Commit complete validated workspace to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist artifacts/npm
          git diff --cached --stat
          git commit -m 'feat: shared block editor, automatic insert updates and analytic parametric constraint solving'
          git push origin HEAD:main
          echo "Release source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save validation evidence and all package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-050-parametric-authoring-validation
          path: artifacts
          if-no-files-found: warn
