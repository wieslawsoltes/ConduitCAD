name: Validate 3D backends and publish recovered workspace
on:
  push:
    branches: [feature/3d-modeling-080]
    paths: [.github/workflows/validate-3d-gpu.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-3d-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3d-modeling-080
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure deterministic Linux GPU presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_modeling_backends.py');s=p.read_text()
          if 'launch_args=' not in s:
              s=s.replace('import shutil\n','import shutil\nimport sys\n')
              replacement="reports=[];errors=[]\nlaunch_args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-webgpu','--enable-unsafe-swiftshader']\nif sys.platform.startswith('linux'):\n # Native Vulkan presentation needs a display (CI runs this test under Xvfb).\n # https://github.com/visgl/luma.gl/issues/2874\n launch_args += ['--enable-gpu','--enable-features=Vulkan','--use-vulkan=swiftshader']\n"
              assert s.count('reports=[];errors=[]\n')==1
              s=s.replace('reports=[];errors=[]\n',replacement)
              old="args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-webgpu','--enable-unsafe-swiftshader'])"
              assert s.count(old)==1
              s=s.replace(old,'args=launch_args)')
              s=s.replace('report.update(requested=requested,executedRequestedBackend=executed,capabilities=capability,physicalDevice=False)','report.update(requested=requested,executedRequestedBackend=executed,capabilities=capability,physicalDevice=False,browserVersion=browser.version,launchArguments=launch_args)')
              p.write_text(s)
          compile(s,str(p),'exec')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser_modeling_backends.py
          if ! git diff --cached --quiet; then
            git commit -m 'test: configure software Vulkan presentation and record backend launch evidence'
            git push origin HEAD:feature/3d-modeling-080
          fi
      - name: Build packages and engineering examples
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run samples:3d
          npm run build
          rm -f artifacts/npm/*-0.7.1.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: Run all browser and GPU regressions without waiving failures
        env:
          CONDUIT_TEST_ORIGIN: localhost
        shell: bash
        run: |
          set -euo pipefail
          status=0
          if xvfb-run -a python tests/browser_modeling_backends.py > artifacts/publication-browser_modeling_backends.log 2>&1; then code=0; else code=$?; status=1; fi
          tail -n 90 artifacts/publication-browser_modeling_backends.log
          echo "browser_modeling_backends: exit $code" >> "$GITHUB_STEP_SUMMARY"
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents browser_mobile_ui browser_modeling3d; do
            if python "tests/$suite.py" > "artifacts/publication-$suite.log" 2>&1; then code=0; else code=$?; status=1; fi
            tail -n 12 "artifacts/publication-$suite.log"
            echo "$suite: exit $code" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Independent native DXF audits
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          for suite in audit_dxf audit_fidelity audit_symbol_library audit_interop audit_cad_editing audit_parametric audit_drawing_tools audit_modeling3d render_symbol_atlas; do
            python "tests/$suite.py"
          done
      - name: Commit all validated generated deliverables and evidence
        run: |
          git add -A -- artifacts samples docs
          git add -f dist artifacts/npm
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated 0.8.0 application, 18 packages, 3D examples and regression evidence'
            git push origin HEAD:feature/3d-modeling-080
          fi
          echo "Validated checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive exact source checkpoint
        if: always()
        run: git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.8.0-source-checkpoint.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-080-final-validation
          path: |
            ${{ runner.temp }}/ConduitCAD-0.8.0-source-checkpoint.zip
            artifacts
          retention-days: 30
