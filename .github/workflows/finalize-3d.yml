name: Commit and validate recovered 3D workspace
on:
  push:
    branches: [feature/3d-modeling-080]
    paths: [.github/workflows/finalize-3d.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-3d-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3d-modeling-080
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply original verified source and reconstructed validation tail
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,lzma,pathlib,re,subprocess
          base='617ea9b10989f4f5009b0dc4518d7df7dc142b8f'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          directory=pathlib.Path('.recovery/3d-080')
          raw=b''.join(p.read_bytes() for p in sorted(directory.glob('part-*.xz')))
          assert len(raw)==66000 and hashlib.sha256(raw).hexdigest()=='963cd0b2908c9a525e282a0c39c61ee6437cbed8c5d2cfc9668d9a539b2fa1a4'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(raw,max_length=8*1024*1024)
          assert len(patch)==273074 and hashlib.sha256(patch).hexdigest()=='ad43b167c11ca08cd427b46ca633bbb32c0fea2cae78bdce44ed3804c33e40aa'
          chunks=[p for p in re.split(b'(?m)(?=^diff --git )',patch) if p.startswith(b'diff --git ')]
          assert len(chunks)==57
          paths=[]
          for chunk in chunks[:-1]:
              name=re.search(rb'(?m)^\+\+\+ b/(.+)',chunk).group(1).decode()
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert '.git' not in path.parts and 'node_modules' not in path.parts
              # Workflow installation is performed separately through the connector.
              if name=='.github/workflows/pages.yml':continue
              assert path.parts[0] in ('README.md','RELEASE_NOTES.md','docs','package.json','packages','scripts','tests')
              subprocess.run(['git','diff','--quiet',base,'HEAD','--',name],check=True)
              subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=chunk,check=True)
              subprocess.run(['git','apply','--unidiff-zero','-'],input=chunk,check=True)
              content=pathlib.Path(name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              expected=re.search(rb'(?m)^index [0-9a-f]+\.\.([0-9a-f]+)',chunk).group(1).decode()
              assert actual==expected,(name,actual,expected)
              paths.append(name)
          additions=(directory/'publication-additions.patch.xz').read_bytes()
          assert len(additions)==9036 and hashlib.sha256(additions).hexdigest()=='f616478915db281a839293bc456edb6784176842fa07546b3d0bfe2dba64b24a'
          tail=lzma.decompress(additions,memlimit=256*1024*1024)
          assert len(tail)==32021 and hashlib.sha256(tail).hexdigest()=='fbcb787e0c10f292be59a38179cd62512b44eddd3474943b6050fff828a8881f'
          additional=[p.decode() for p in re.findall(rb'(?m)^\+\+\+ b/(.+)',tail)]
          assert set(additional)=={'packages/modeling/src/vertices.js','tests/modeling3d.test.mjs','tests/modeling3d-recovery.test.mjs','tests/types-smoke.ts','tests/requirements.txt','docs/PUBLICATION_3D_080.md','docs/3d-recovered-files.json'}
          subprocess.run(['git','apply','--check','-'],input=tail,check=True)
          subprocess.run(['git','apply','-'],input=tail,check=True)
          subprocess.run(['git','add','--',*sorted(set(paths+additional))],check=True)
          print('Original recovered files verified; new tests and atomic detach repair applied.')
          PY
      - name: Push source checkpoint before validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: recover 3D CAD modeling, editable feature history and ten example drawings' -m 'Restore hash-verified production files from the interrupted upload. Recover complete historical test cases, add explicit recovery-time regressions and fix atomic mesh-feature detachment. Validation results are recorded separately; no full AutoCAD/Fusion parity claim.'
          git push origin HEAD:feature/3d-modeling-080
          echo "Source checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build all generated examples, application and npm packages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run samples:3d
          npm run build
          rm -f artifacts/npm/*-0.7.1.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: Browser and storage regressions including 3D native-origin downloads
        env:
          CONDUIT_TEST_ORIGIN: localhost
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents browser_mobile_ui browser_modeling3d browser_modeling_backends; do
            python "tests/$suite.py" > "artifacts/publication-$suite.log" 2>&1
            code=$?
            tail -n 18 "artifacts/publication-$suite.log"
            echo "$suite: exit $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Independent native DXF and geometry audits
        shell: bash
        run: |
          set -euo pipefail
          for suite in audit_dxf audit_fidelity audit_symbol_library audit_interop audit_cad_editing audit_parametric audit_drawing_tools audit_modeling3d render_symbol_atlas; do
            python "tests/$suite.py"
          done
      - name: Commit all validated generated files and evidence
        run: |
          git add -A -- artifacts samples docs
          git add -f dist artifacts/npm
          git commit -m 'build: publish validated 0.8.0 application, 18 packages, 3D examples and test evidence'
          git push origin HEAD:feature/3d-modeling-080
          echo "Validated checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive exact source checkpoint
        if: always()
        run: git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.8.0-source-checkpoint.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-080-publication-validation
          path: |
            ${{ runner.temp }}/ConduitCAD-0.8.0-source-checkpoint.zip
            artifacts
          retention-days: 30
