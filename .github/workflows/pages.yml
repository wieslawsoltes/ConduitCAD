name: Validate and publish ConduitCAD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conduitcad-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Link reusable packages without network dependencies
        run: node scripts/bootstrap.mjs
      - name: Unit tests, examples, production build and reusable archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run samples:3d
          npm run samples:rendering
          npm run samples:visual2d
          npm run samples:live
          npm run icons
          npm run build
          npm run pack:packages
      - name: Clean offline installation of reusable packages
        run: node scripts/verify-packages.mjs
      - name: Strict TypeScript consumer contracts
        run: npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: Native-origin editing, mobile, recovery and required GPU execution
        env:
          CONDUIT_TEST_ORIGIN: localhost
        shell: bash
        run: |
          set -euo pipefail
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents browser_mobile_ui browser_modeling3d browser_authoring3d browser_iconography browser_planar_visual browser_visual_editing browser_render_styles browser_live_workspace; do
            python "tests/$suite.py"
          done
          for backend in webgl2 webgpu; do
            PLANAR_TEST_BACKEND="$backend" xvfb-run -a python tests/browser_planar_visual.py
            VISUAL_TEST_BACKEND="$backend" xvfb-run -a python tests/browser_visual_editing.py
            LIVE_TEST_BACKEND="$backend" xvfb-run -a python tests/browser_live_workspace.py
          done
          REQUIRE_WEBGPU=1 xvfb-run -a python tests/browser_render_backends.py
          xvfb-run -a python tests/browser_modeling_backends.py
      - name: Independent DXF, geometry and symbol audits
        shell: bash
        run: |
          set -euo pipefail
          for suite in audit_dxf audit_fidelity audit_symbol_library audit_interop audit_cad_editing audit_parametric audit_drawing_tools audit_modeling3d audit_rendering audit_visual_editing audit_planar_visual audit_live_workspace render_symbol_atlas; do
            python "tests/$suite.py"
          done
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload production website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload validation reports and package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-validation-and-packages
          path: artifacts
          if-no-files-found: warn
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce expected build and verify live hosted bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/build.mjs
          node scripts/verify-pages.mjs "$PAGE_URL"
      - name: Upload live deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-live-deployment-verification
          path: artifacts/pages-verification.json
          if-no-files-found: error
