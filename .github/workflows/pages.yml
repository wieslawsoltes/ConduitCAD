name: Validate and publish ConduitCAD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conduitcad-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Link reusable packages without network dependencies
        run: node scripts/bootstrap.mjs
      - name: Unit tests, catalogue, production build, and reusable package archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run build
          npm run pack:packages
      - name: Clean offline installation and integration of all reusable packages
        run: node scripts/verify-packages.mjs
      - name: Strict TypeScript consumer contracts
        run: npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validation dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print('CHROMIUM_EXECUTABLE=' + playwright.chromium.executable_path)
          PY
      - name: Browser editing, mobile catalogue, pixel clipping, and independent DXF audits
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_interop.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_cad_editing.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_parametric.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_drawing_tools.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/audit_cad_editing.py
          python tests/audit_parametric.py
          python tests/audit_drawing_tools.py
          python tests/render_symbol_atlas.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload production website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload validation reports and all reusable npm archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-validation-and-packages
          path: artifacts
          if-no-files-found: warn
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish application
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce expected build and verify live hosted bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/build.mjs
          node scripts/verify-pages.mjs "$PAGE_URL"
      - name: Upload live deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-live-deployment-verification
          path: artifacts/pages-verification.json
          if-no-files-found: error
