name: Recover interrupted 3D source
on:
  push:
    branches: [feature/3d-modeling-080]
    paths: [.github/workflows/recover-3d-source.yml, .recovery/3d-080/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover the uploaded patch without modifying source
        run: |
          python - <<'PY'
          import hashlib,json,lzma,pathlib,re,subprocess
          out=pathlib.Path('recovered');out.mkdir()
          parts=sorted(pathlib.Path('.recovery/3d-080').glob('part-*.xz'))
          raw=b''.join(p.read_bytes() for p in parts)
          (out/'uploaded.xz').write_bytes(raw)
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(raw,max_length=8*1024*1024)
          (out/'recovered.patch').write_bytes(patch)
          record={'baseline':'617ea9b10989f4f5009b0dc4518d7df7dc142b8f','completeXZ':decoder.eof,'unusedBytes':len(decoder.unused_data),'compressedBytes':len(raw),'patchBytes':len(patch),'compressedSHA256':hashlib.sha256(raw).hexdigest(),'patchSHA256':hashlib.sha256(patch).hexdigest(),'parts':[{'name':p.name,'bytes':p.stat().st_size,'gitBlob':hashlib.sha1(b'blob '+str(p.stat().st_size).encode()+b'\0'+p.read_bytes()).hexdigest()} for p in parts]}
          chunks=re.split(b'(?m)(?=^diff --git )',patch)
          valid=[];invalid=[]
          for i,chunk in enumerate(chunks):
              if not chunk.startswith(b'diff --git '):continue
              file=out/f'file-{i:03}.patch';file.write_bytes(chunk)
              result=subprocess.run(['git','apply','--unidiff-zero','--check',str(file)],capture_output=True,text=True)
              (valid if result.returncode==0 else invalid).append({'file':file.name,'header':chunk.splitlines()[0].decode(),'check':result.stderr})
          record['applicableFilePatches']=valid;record['incompleteOrInvalidPatches']=invalid
          (out/'recovery.json').write_text(json.dumps(record,indent=2))
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-recovered-3d-source
          path: recovered
          retention-days: 30
