name: Native rendering backends
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/gpu-validation.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/build.mjs
      - run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Execute native backend probes on localhost
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','4173','--directory','dist'],stdout=subprocess.DEVNULL)
          reports=[]
          try:
            time.sleep(1)
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-unsafe-webgpu','--enable-unsafe-swiftshader'])
              for backend in ['canvas','webgl2','webgpu']:
                page=browser.new_page(viewport={'width':1280,'height':800})
                errors=[]
                page.on('pageerror',lambda error:errors.append(str(error)))
                page.on('console',lambda message:errors.append(message.text) if message.type=='error' else None)
                page.goto('http://localhost:4173/?fresh=1&renderer='+backend)
                page.wait_for_function('document.documentElement.dataset.ready === "true"')
                page.evaluate("conduit.newDocument('blank');conduit.executeCommand('LINE 0,0 100,100');conduit.renderer.fit()")
                page.wait_for_timeout(500)
                report=page.evaluate('''async()=>{let a=await navigator.gpu?.requestAdapter();return {stats:conduit.renderer.stats,secure:isSecureContext,adapter:a?{vendor:a.info.vendor,architecture:a.info.architecture,description:a.info.description}:null};}''')
                report.update(requested=backend,errors=errors,physicalDevice=False)
                reports.append(report)
                pathlib.Path('artifacts').mkdir(exist_ok=True)
                page.screenshot(path='artifacts/backend-'+backend+'.png')
                page.close()
              browser.close()
            pathlib.Path('artifacts/backend-probe.json').write_text(json.dumps(reports,indent=2))
            print(json.dumps(reports,indent=2))
          finally:
            server.terminate()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-backend-probe
          path: artifacts/backend-*
