name: Apply verified DXF interoperability release
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-dxf-interop.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-dxf-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source patch and preserve concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '43ac28abec11af207b79929b569bfa50552cfe69'
          shas = '''7c9f5e614bba6a064e3adb5c3d0dab0a0e56dabd
          30bb15e4e07626d808f8ea760c50f0791552cee7
          81b6bae91aa74252389420cdbdd133d1a54c49f5
          c1ed55736315783773daa3b66ec53df11f48bcc3
          d9e190a7d94bd17ff2d7bfc670ffba6e2a92bdf6
          265bf4dc6658e4be201ea6e9be89700ec295a3fa
          28eab46bef9f1a56a73ce431b79f8c35a6272497
          376b1f33b8d9102cd8f14bde6f5f9814eee1816f'''.split()
          parts = []
          for index, sha in enumerate(shas):
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              data = base64.b64decode(record['content'])
              assert len(data) == (6000 if index < 7 else 3232), f'Invalid fragment {index + 1}'
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert len(compressed) == 45232
          assert hashlib.sha256(compressed).hexdigest() == 'd9f1a73114e38080416e4ab789087fd9a1930f99b2a7ca7d547814ec66ac41a8'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(compressed, max_length=192368)
          assert decoder.eof and not decoder.unused_data and len(patch) == 192367
          assert hashlib.sha256(patch).hexdigest() == '0f7a5b72f83749cd66932e4e5489162f62997ae4e563bb493971f2e4a004d01a'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-interop.patch'
          target.write_bytes(patch)
          stat = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = [line.split('\t', 2)[2] for line in stat.splitlines()]
          assert len(paths) == 41 and len(set(paths)) == 41
          for name in paths:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert not any(p in ('.git', '.github', 'node_modules') for p in path.parts)
              assert path.parts[0] in ('README.md', 'RELEASE_NOTES.md', 'package.json', 'packages', 'tests', 'docs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
          print('Applied all 41 checksum-verified source, declaration, documentation and test files.')
          PY
      - name: Test and reproduce all deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          npm run build
          rm -f artifacts/npm/*-0.2.1.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser and independent DXF validator
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Validate browser editing, real-origin DXF downloads and independent interoperability
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser_smoke.py
          python tests/browser_workflows.py
          python tests/browser_fidelity.py
          python tests/browser_symbols.py
          CONDUIT_TEST_ORIGIN=localhost python tests/browser_interop.py
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/render_symbol_atlas.py
      - name: Commit complete validated workspace to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist artifacts/npm
          git diff --cached --stat
          git commit -m 'feat: native DXF dimensions, paper viewports, binary export and guarded record preservation'
          git push origin HEAD:main
          echo "Release source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save validation evidence and package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-030-dxf-interop-validation
          path: artifacts
          if-no-files-found: warn
