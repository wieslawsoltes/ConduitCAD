name: Validate and checkpoint 3D authoring 0.9.0
on:
  push:
    branches: [work/3d-authoring-090]
    paths: [.github/workflows/publish-authoring-090.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-authoring-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/3d-authoring-090
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksum-verified source without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,os,json,pathlib,re,subprocess,urllib.request
          base='acae3ce7d05559b57ed51f67888b8b52163dcb48'
          shas=['8487e48f69638aee42ef76d2e064d8fac281d23d','9ddeb8b376d05d777e31610a0b9f8684521198f5','82c65c332849e4d8710d188c12d46ca35eefeb69','86013755b7fcf33e42f6f2833cb7b77f81f31d77','360ca2ce14dd5c282683ff1ceed267ee43ec7f80']
          parts=[]
          for i,sha in enumerate(shas):
              request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response:record=json.load(response)
              data=base64.b64decode(record['content'])
              assert len(data)==(6000 if i<4 else 3816)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          raw=b''.join(parts)
          assert len(raw)==27816 and hashlib.sha256(raw).hexdigest()=='9226b02c1cb69325dde4688b44605140850ceb750bac9efccff03966bb88ef01'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(raw,max_length=103418)
          assert decoder.eof and not decoder.unused_data and len(patch)==103417
          assert hashlib.sha256(patch).hexdigest()=='217983858b8185d10bbe7aebb29aa11babfa08b685e13d3d0ac2d7494fc127df'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'authoring-090.patch';target.write_bytes(patch)
          stats=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          paths=[line.split('\t',2)[2] for line in stats.splitlines()]
          assert len(paths)==36 and len(set(paths))==36
          for name in paths:
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert not any(x in p.parts for x in ('.git','.github','node_modules'))
              assert p.parts[0] in ('README.md','RELEASE_NOTES.md','package.json','packages','tests','docs')
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          applied=subprocess.run(['git','apply','--reverse','--unidiff-zero','--check',str(target)],capture_output=True).returncode==0
          if not applied:
              subprocess.run(['git','diff','--quiet',base,'HEAD','--',*paths],check=True)
              subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          for chunk in re.split(rb'(?m)(?=^diff --git )',patch):
              if not chunk.startswith(b'diff --git '):continue
              name=re.search(rb'(?m)^\+\+\+ b/(.+)',chunk).group(1).decode()
              expected=re.search(rb'(?m)^index [0-9a-f]+\.\.([0-9a-f]+)',chunk).group(1).decode()
              data=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected,name
          subprocess.run(['git','add','--',*paths],check=True)
          print('All 36 source files match their independently recorded target Git hashes.')
          PY
      - name: Commit source checkpoint before validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'feat: face-based holes, extrusion operations and contextual touch authoring'
            git push origin HEAD:work/3d-authoring-090
          fi
          echo "Source checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests, builds, example drawings and package contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run samples:3d
          npm run build
          rm -f artifacts/npm/*-0.8.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: Run all real-origin 2D, 3D, mobile and recovery browser suites
        env:
          CONDUIT_TEST_ORIGIN: localhost
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents browser_mobile_ui browser_modeling3d browser_authoring3d; do
            if python "tests/$suite.py" > "artifacts/authoring-$suite.log" 2>&1; then code=0; else code=$?; status=1; fi
            tail -n 18 "artifacts/authoring-$suite.log"
            echo "$suite: exit $code" >> "$GITHUB_STEP_SUMMARY"
          done
          if xvfb-run -a python tests/browser_modeling_backends.py > artifacts/authoring-browser_modeling_backends.log 2>&1; then code=0; else code=$?; status=1; fi
          tail -n 35 artifacts/authoring-browser_modeling_backends.log
          echo "browser_modeling_backends: exit $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Independent native DXF and geometry audits
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          for suite in audit_dxf audit_fidelity audit_symbol_library audit_interop audit_cad_editing audit_parametric audit_drawing_tools audit_modeling3d render_symbol_atlas; do
            python "tests/$suite.py"
          done
      - name: Commit validated distribution, samples and test evidence
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- artifacts samples docs
          git add -f dist artifacts/npm
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated 0.9.0 application, 18 packages and 13 editable 3D starters'
            git push origin HEAD:work/3d-authoring-090
          fi
          echo "Validated checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive exact source checkpoint
        if: always()
        run: git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.9.0-source-checkpoint.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-090-authoring-validation
          path: |
            ${{ runner.temp }}/ConduitCAD-0.9.0-source-checkpoint.zip
            artifacts
          retention-days: 30
