name: Validate mobile release follow-up
on:
  push:
    branches: [work/mobile-071]
    paths: [.github/workflows/validate-mobile-followup.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-mobile-071
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mobile-071
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct explicit multi-page browser context and record startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_documents.py');s=p.read_text()
          old="        page = browser.new_page(viewport={'width': 1440, 'height': 960}, accept_downloads=True)"
          new="        desktop = browser.new_context(viewport={'width': 1440, 'height': 960}, accept_downloads=True)\n        page = desktop.new_page()"
          if old in s:
              assert s.count(old)==1
              s=s.replace(old,new)
          else: assert new in s
          old='    page.wait_for_function(\'document.documentElement.dataset.ready === "true"\')'
          new='''    try:
                  page.wait_for_function('document.documentElement.dataset.ready === "true"')
              except Exception:
                  print('STARTUP DIAGNOSTICS ' + json.dumps(page.evaluate("async()=>({ready:document.documentElement.dataset.ready,error:window.appError||null,mounted:!!window.conduit,key:window.conduit?.documents?.key,locks:await navigator.locks?.query?.(),text:document.body.innerText.slice(-2000)})")), flush=True)
                  raise'''
          # Dedent the YAML-contained Python multiline replacement to the function body.
          new='\n'.join(line[10:] if i else line for i,line in enumerate(new.splitlines()))
          if 'STARTUP DIAGNOSTICS' not in s:
              assert s.count(old)==1
              s=s.replace(old,new)
          s=s.replace('errors.append(str(error))', "errors.append(getattr(error, 'stack', str(error)))").replace('errors.append(str(e))', "errors.append(getattr(e, 'stack', str(e)))")
          old='            nested = page.context.new_page()'
          new=old+"\n            nested.on('pageerror', lambda e: errors.append(getattr(e, 'stack', str(e))))"
          if "nested.on('pageerror'" not in s:s=s.replace(old,new)
          compile(s,str(p),'exec');p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser_documents.py
          if ! git diff --cached --quiet; then
            git commit -m 'test: use explicit browser context for duplicated-window recovery coverage'
            git push origin HEAD:work/mobile-071
          fi
      - name: Unit tests, build, catalogue, package contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run build
          rm -f artifacts/npm/*-0.7.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: Real-origin multi-page recovery
        env:
          CONDUIT_TEST_ORIGIN: localhost
        run: python tests/browser_documents.py
      - name: Mobile UI and all existing browser suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_mobile_ui; do
            CONDUIT_TEST_ORIGIN=localhost python "tests/$suite.py" > "artifacts/mobile-071-$suite.log" 2>&1 || { cat "artifacts/mobile-071-$suite.log"; exit 1; }
            tail -n 2 "artifacts/mobile-071-$suite.log"
          done
      - name: Independent DXF and symbol audits
        run: |
          set -e
          python tests/audit_dxf.py
          python tests/audit_fidelity.py
          python tests/audit_symbol_library.py
          python tests/audit_interop.py
          python tests/audit_cad_editing.py
          python tests/audit_parametric.py
          python tests/audit_drawing_tools.py
          python tests/render_symbol_atlas.py
      - name: Commit validated generated deliverables and evidence
        run: |
          git add -A -- artifacts samples docs
          git add -f dist artifacts/npm
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated mobile 0.7.1 application, packages and regression evidence'
            git push origin HEAD:work/mobile-071
          fi
          echo "Validated commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive checkpoint
        if: always()
        run: git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.7.1-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-mobile-followup-validation
          path: |
            ${{ runner.temp }}/ConduitCAD-0.7.1-source.zip
            artifacts
          if-no-files-found: error
