name: Finalize validated 3D authoring 0.9.0
on:
  push:
    branches: [work/3d-authoring-090]
    paths: [.github/workflows/finalize-authoring-090.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-authoring-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/3d-authoring-090
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified final form and catalogue regressions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,os,json,pathlib,subprocess,urllib.request
          base='93857204a7ef757214c8ff6f6b5ff8c353584731'
          sha='8bad74ef0a7b1f6d5f0af59da4cdc128cc2808d9'
          request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=60) as response:record=json.load(response)
          raw=base64.b64decode(record['content'])
          assert len(raw)==1832 and hashlib.sha256(raw).hexdigest()=='65195473dfae11b67084b1b61688e77af25461c472b2c5989542e3d1e5c1ac19'
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(raw,max_length=4457)
          assert decoder.eof and not decoder.unused_data and len(patch)==4456
          assert hashlib.sha256(patch).hexdigest()=='75db4fd52b7229118d7310c079f9e3d802e3087abb43cad2d6fe605fc512c316'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'authoring-polish.patch';target.write_bytes(patch)
          stat=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          paths=[line.split('\t',2)[2] for line in stat.splitlines()]
          assert set(paths)=={'packages/workbench/src/authoring-workbench.js','tests/browser_authoring3d.py','tests/browser_symbols.py'} and len(paths)==3
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          applied=subprocess.run(['git','apply','--reverse','--unidiff-zero','--check',str(target)],capture_output=True).returncode==0
          if not applied:
              subprocess.run(['git','diff','--quiet',base,'HEAD','--',*paths],check=True)
              subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: retain expression choices and synchronize navigation and starter UI contracts'
            git push origin HEAD:work/3d-authoring-090
          fi
          echo "Source checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests, builds, example drawings and package contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run samples:3d
          npm run build
          rm -f artifacts/npm/*-0.8.0.tgz
          npm run pack:packages
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install independent validators
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:print('CHROMIUM_EXECUTABLE='+p.chromium.executable_path)
          PY
      - name: All 2D, 3D, mobile, recovery and rendering browser suites
        env:
          CONDUIT_TEST_ORIGIN: localhost
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents browser_mobile_ui browser_modeling3d browser_authoring3d; do
            if python "tests/$suite.py" > "artifacts/authoring-$suite.log" 2>&1; then code=0; else code=$?; status=1; fi
            tail -n 18 "artifacts/authoring-$suite.log"
            echo "$suite: exit $code" >> "$GITHUB_STEP_SUMMARY"
          done
          if xvfb-run -a python tests/browser_modeling_backends.py > artifacts/authoring-browser_modeling_backends.log 2>&1; then code=0; else code=$?; status=1; fi
          tail -n 35 artifacts/authoring-browser_modeling_backends.log
          echo "browser_modeling_backends: exit $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Independent native DXF and geometry audits
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          for suite in audit_dxf audit_fidelity audit_symbol_library audit_interop audit_cad_editing audit_parametric audit_drawing_tools audit_modeling3d render_symbol_atlas; do
            python "tests/$suite.py"
          done
      - name: Commit validated distribution, samples and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- artifacts samples docs
          git add -f dist artifacts/npm
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated 0.9.0 application, 18 packages and 13 editable 3D starters'
            git push origin HEAD:work/3d-authoring-090
          fi
          echo "Validated checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive exact source checkpoint
        if: always()
        run: git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.9.0-source-checkpoint.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduitcad-090-final-validation
          path: |
            ${{ runner.temp }}/ConduitCAD-0.9.0-source-checkpoint.zip
            artifacts
          retention-days: 30
