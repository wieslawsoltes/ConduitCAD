name: Source snapshot
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/source-archive.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create reproducible source archive
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/conduit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-source-snapshot
          path: ${{ runner.temp }}/conduit-source.tar
          retention-days: 7
