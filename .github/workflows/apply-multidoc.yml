name: Checkpoint multi-document build and validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-multidoc.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conduitcad-multidoc-source-import
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained source checkpoint
        run: |
          git merge-base --is-ancestor fcc51c33856319d2a5457596f5686facd92df71b HEAD
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              'packages/workbench/src/document-workbench.js': '1f0f4bb27c16fcc9625c8388a7df88f0eddebd6d5b7a33da100e0305b31eacb2',
              'packages/workbench/src/mobile-workspace.js': '6721b75ba7cef69425e095a992238969dc9e7a9a54cf8677ed935dc06194cab1',
              'packages/workspace/src/index.js': '9d7bcdddf696a048f27b1d12d3d20749ad3ad1bda7a0273cfdc62433d523806b'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          print('Retained implementation matches the preserved package snapshot.')
          PY
      - name: Reproduce and commit all generated deliverables
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap.mjs
          npm run catalog
          node scripts/drawing-tool-samples.mjs
          npm run build
          rm -f artifacts/npm/*-0.6.0.tgz
          npm run pack:packages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- artifacts
          git add -f dist artifacts/npm
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'build: regenerate multi-document 0.7.0 application and package archives' -m 'Generated source checkpoint artifacts, not a validated release. Known browser issues remain subject to validation; no deployment gates have been disabled.'
            git push origin HEAD:main
          fi
          git archive --format=zip --prefix=ConduitCAD/ HEAD > "$RUNNER_TEMP/ConduitCAD-0.7.0-source-checkpoint.zip"
          echo "Complete checkpoint: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests and package contracts
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee artifacts/ci-unit-tests.log
          node scripts/verify-packages.mjs
          npx --yes --package typescript@5.8.3 tsc -p tests/tsconfig.json
      - name: Install browser validation dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Report every browser suite without hiding failures
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for suite in browser_smoke browser_workflows browser_fidelity browser_symbols browser_interop browser_cad_editing browser_parametric browser_drawing_tools browser_documents; do
            CONDUIT_TEST_ORIGIN=localhost python "tests/$suite.py" > "artifacts/checkpoint-$suite.log" 2>&1
            code=$?
            tail -n 16 "artifacts/checkpoint-$suite.log"
            echo "$suite: exit $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Preserve source archive and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduitcad-070-source-checkpoint
          path: |
            ${{ runner.temp }}/ConduitCAD-0.7.0-source-checkpoint.zip
            artifacts
          if-no-files-found: warn
